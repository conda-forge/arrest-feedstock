schema_version: 1

context:
  name: arrest
  version: "0.2.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/arrest-${{ version }}.tar.gz
  sha256: 26fd328e8263df39cbc93d6e8d785b4895c2474a81596f2bfd4cdd6a3de59f18

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pydantic >=2.0.0,<3.0.0
    - httpx >=0.27.0
    - orjson >=3.9.10
    - pyyaml >=6.0.1
    - argcomplete >=3.2.2
    - tenacity >=8.5.0
    - pydantic-xml >=2.21.0

tests:
  - python:
      imports:
        - arrest
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Arrest is a wrapper of pydantic and httpx to make your REST api calls type-safe and structured
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/s-bose/arrest
  documentation: https://s-bose.github.io/arrest

extra:
  recipe-maintainers:
    - thewchan
